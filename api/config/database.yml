# Connection details come from DATABASE_URL when set (Docker), otherwise
# default to the Postgres container exposed on localhost:5432.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: property_search_development

test:
  <<: *default
  database: property_search_test

production:
  <<: *default
  database: property_search_production
